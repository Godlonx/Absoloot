spring:
  application:
    name: atelier-pratique
  datasource:
    url: jdbc:h2:mem:fantasy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  h2:
    console:
      enabled: true
      path: /h2

app:
  jwt:
    secret: change-me-super-secret-key-for-absoloot-atelier-pratique-jwt-2026
    expiration-ms: 86400000